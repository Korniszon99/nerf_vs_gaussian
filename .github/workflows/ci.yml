name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gs_vs_nerf
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py test && python manage.py makemigrations --check --dry-run
      - name: Audit resolved dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-dev.txt
